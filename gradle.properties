# =====================================================================
#  SETTINGS YOU MIGHT WANT TO CHANGE
# =====================================================================

# Where the "Copy mod into modpack" task puts the finished jar.
# This is the mods folder of your Modrinth App instance.
# Use forward slashes (/) in the path, not backslashes.
modpack_mods_folder=C:/Users/Paddy/AppData/Roaming/ModrinthApp/profiles/pd_main2/mods

# The build also looks in this folder for the Radiance and Entity Texture Features jars
# it needs (only while building, they are never bundled). Their file names don't matter
# as long as they start with "Radiance-" and "entity_texture_features-".

# The mod version. Bump this whenever you release a new build.
mod_version=1.0.0

# =====================================================================
#  MOD INFO (rarely changes)
# =====================================================================

mod_id=radiance_patches
mod_name=Radiance Patches
mod_authors=Paddy-V (Paddy's Dreamland)
mod_license=MIT
mod_group_id=dev.paddysdreamland.radiancepatches

# =====================================================================
#  MINECRAFT / NEOFORGE VERSIONS (leave alone unless updating)
# =====================================================================

minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.256
loader_version_range=[1,)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# =====================================================================
#  GRADLE INTERNALS (leave alone)
# =====================================================================

org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
